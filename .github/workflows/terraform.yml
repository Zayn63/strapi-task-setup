name: CD - Deploy Strapi to EC2 via Terraform

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        default: 'latest'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var="image_tag=${{ github.event.inputs.image_tag }}" \
                             -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY }}" \
                             -var="aws_secret_key=${{ secrets.AWS_SECRET_KEY }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="image_tag=${{ github.event.inputs.image_tag }}" \
                             -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY }}" \
                             -var="aws_secret_key=${{ secrets.AWS_SECRET_KEY }}"
