name: Deploy Strapi with Terraform

on:
  push:
    branches: [ zayn-strapi-set ]
  workflow_dispatch:

env:
  TF_VAR_docker_username: ${{ secrets.DOCKER_USERNAME }}
  TF_VAR_image_tag: ${{ secrets.IMAGE_TAG }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker buildx build ./docker \
            --file ./docker/Dockerfile \
            --tag ${{ secrets.DOCKER_USERNAME }}/strapi:${{ secrets.IMAGE_TAG }} \
            --push

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        run: terraform -chdir=./terraform init

      - name: Terraform Plan
        run: terraform -chdir=./terraform plan \
          -var="docker_username=${{ secrets.DOCKER_USERNAME }}" \
          -var="image_tag=${{ secrets.IMAGE_TAG }}"

      - name: Terraform Apply
        run: terraform -chdir=./terraform apply -auto-approve \
          -var="docker_username=${{ secrets.DOCKER_USERNAME }}" \
          -var="image_tag=${{ secrets.IMAGE_TAG }}"
