name: CD - Deploy with Terraform

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download image tag
        uses: actions/download-artifact@v3
        with:
          name: image-tag
          path: ./terraform

      - name: Set image tag
        run: echo "IMAGE_TAG=$(cat ./terraform/image-tag.txt)" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Init Terraform
        working-directory: ./terraform
        run: terraform init

      - name: Plan Terraform
        working-directory: ./terraform
        run: terraform plan -var="docker_image=${{ env.IMAGE_TAG }}"

      - name: Apply Terraform
        working-directory: ./terraform
        run: terraform apply -auto-approve -var="docker_image=${{ env.IMAGE_TAG }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Verify Server
        run: |
          sleep 60
          PUBLIC_IP=$(terraform -chdir=./terraform output -raw instance_ip)
          echo "Testing http://$PUBLIC_IP ..."
          curl --fail http://$PUBLIC_IP || echo "❌ Could not reach server"
