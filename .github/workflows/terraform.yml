name: CD - Deploy with Terraform

on:
  push:
    branches:
      - zayn-strapi-set
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Strapi on EC2
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-north-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform init
        working-directory: ./terraform

      - name: Format Check
        run: terraform fmt -check
        working-directory: ./terraform

           - name: Terraform Plan
        run: terraform plan -var="docker_username=${{ secrets.DOCKER_USERNAME }}" -var="docker_password=${{ secrets.DOCKER_PASSWORD }}" -var="docker_image=zayn63/strapi:latest"
        working-directory: ./terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="docker_username=${{ secrets.DOCKER_USERNAME }}" -var="docker_password=${{ secrets.DOCKER_PASSWORD }}" -var="docker_image=zayn63/strapi:latest"
        working-directory: ./terraform

