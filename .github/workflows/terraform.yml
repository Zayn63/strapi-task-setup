name: CI - Build & Push Docker Image

on:
  push:
    branches:
      - zayn-strapi-set

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Generate image tag
        id: vars
        run: echo "tag=strapi:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ steps.vars.outputs.tag }} -f docker/Dockerfile.strapi .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ steps.vars.outputs.tag }}

      - name: Save image tag as artifact
        run: echo "${{ secrets.DOCKER_USERNAME }}/${{ steps.vars.outputs.tag }}" > image-tag.txt

      - name: Upload image tag
        uses: actions/upload-artifact@v3
        with:
          name: image-tag
          path: image-tag.txt
