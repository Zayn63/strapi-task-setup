name: Deploy Strapi from Docker Hub

on:
  push:
    branches:
      - zayn-strapi-set # Update to your deployment branch if needed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull and Run Strapi Image
        run: |
          docker pull zayn63/strapi:latest
          docker run -d --rm -p 1337:1337 --name strapi zayn63/strapi:latest
