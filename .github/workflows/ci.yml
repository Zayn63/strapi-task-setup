name: Build and Push Strapi Docker Image

on:
  push:
    branches:
      - zayn-strapi-set  # Your working branch

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract short SHA
        id: vars
        run: echo "TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and Push Docker image
        run: |
          docker build -t zayn63/strapi:${{ env.TAG }} -t zayn63/strapi:latest ./docker
          docker push zayn63/strapi:${{ env.TAG }}
          docker push zayn63/strapi:latest

      - name: Set image tag output
        id: image_tag
        run: echo "::set-output name=tag::${{ env.TAG }}"
