name: CI - Build and Push Docker Image

on:
  push:
    branches:
      - zayn-strapi-set

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract short SHA
        id: vars
        run: echo "TAG=build-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and Push Docker image
        run: |
          docker build -t zayn63/strapi:${{ env.TAG }} .
          docker push zayn63/strapi:${{ env.TAG }}

      - name: Upload image tag as artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: |
            .github/image-tag.txt

      - name: Save image tag for Terraform
        run: echo "${{ env.TAG }}" > image-tag.txt
