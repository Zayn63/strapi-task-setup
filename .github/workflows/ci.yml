name: CI - Build and Push Strapi Docker Image

on:
  push:
    branches:
      - zayn-strapi-set  # Your deployment branch

env:
  TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          docker build -f docker/Dockerfile -t zayn63/strapi:${{ env.TAG }} -t zayn63/strapi:latest .
          docker push zayn63/strapi:${{ env.TAG }}
          docker push zayn63/strapi:latest

      - name: Output image tag
        run: echo "Built and pushed image tag: ${{ env.TAG }}"
